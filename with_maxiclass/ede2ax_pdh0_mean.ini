# mAxiCLASS input: the cosmology of with_maxiclass/model/ede2ax_pdh0_mean.dat
# 2-axion EDE, n = 3, Bella, Poulin, Vagnozzi & Knox 2026 (arXiv:2604.13535),
# posterior MEANS for PDH0 (Planck + DESI DR2 + PantheonPlus + H0DN),
# Tables S1 (EDE) and S2 (LCDM parameters); theta_i = 2.8, theta' = 0 (text).
# Neutrinos/lensing as in with_class_mnu and the with_cp_lcdm emulators.
#
# Run from with_maxiclass/maxiclass/ (the binary looks for its data files there):
#   ./class ../ede2ax_pdh0_mean.ini
# Output: output/ede2ax_pdh0_mean_cl_lensed.dat (dimensionless l(l+1)C_l/2pi) + background. The mock itself
# is made with models/make_fiducial.py (see with_maxiclass/make_mocks.sh).

root = output/ede2ax_pdh0_mean
overwrite_root = yes
output = tCl,pCl,lCl
lensing = yes
l_max_scalars = 2508
write background = yes

# LCDM part (omega_cdm = omega_m - omega_b - omega_nu, omega_m = 0.15631 in the mock)
omega_b = 0.02267
omega_cdm = 0.133
H0 = 72.645
tau_reio = 0.060
ln10^{10}A_s = 3.067
n_s = 0.988

N_ur = 2.0328
N_ncdm = 1
m_ncdm = 0.06
non_linear = hmcode

# two axion-like EDE fields (shooting: f_EDE and a_c are targets)
N_mscf = 2
n_axion_mscf = 3,3
fraction_maxion_ac = 0.085,0.073
log10_maxion_ac = -3.440,-4.000
theta_ini_mscf = 2.8,2.8
theta_prime_ini_mscf = 0.,0.
attractor_ic_scf = no
do_shooting = yes
do_shooting_mscf = yes
# tolerance 1 (repo examples) stops after one Newton step; 1e-4 fails to converge
tol_shooting_deltaF = 1e-3
tol_shooting_deltax = 1e-3
background_Nloga = 100000

input_verbose = 1
background_verbose = 1
output_verbose = 1
